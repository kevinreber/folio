[package]
name = "folio"
version = "0.1.0"
edition = "2021"
description = "Local-first career accomplishment tracker"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
anyhow = "1"
colored = "2"
tabled = "0.16"
