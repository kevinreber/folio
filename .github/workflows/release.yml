name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "Cargo.toml"

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Change
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    name: Create Release Tag
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../folio-${{ matrix.target }}.tar.gz folio
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.target }}
          path: folio-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            mv "$dir"/*.tar.gz .
          done
          sha256sum folio-*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/folio-*.tar.gz
            artifacts/sha256sums.txt

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Clone homebrew-tap repo
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/kevinreber/homebrew-tap.git

      - name: Generate updated formula
        run: |
          cd artifacts
          for dir in */; do
            mv "$dir"/*.tar.gz . 2>/dev/null || true
          done
          sha256sum folio-*.tar.gz > sha256sums.txt

          VERSION=${GITHUB_REF_NAME#v}

          SHA_AARCH64_DARWIN=$(grep aarch64-apple-darwin sha256sums.txt | awk '{print $1}')
          SHA_X86_64_DARWIN=$(grep x86_64-apple-darwin sha256sums.txt | awk '{print $1}')
          SHA_AARCH64_LINUX=$(grep aarch64-unknown-linux-gnu sha256sums.txt | awk '{print $1}')
          SHA_X86_64_LINUX=$(grep x86_64-unknown-linux-gnu sha256sums.txt | awk '{print $1}')

          mkdir -p ../homebrew-tap/Formula

          cat > ../homebrew-tap/Formula/folio.rb << FORMULA
          class Folio < Formula
            desc "Local-first career accomplishment tracker"
            homepage "https://github.com/kevinreber/folio"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/kevinreber/folio/releases/download/v#{version}/folio-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_DARWIN}"
              end
              on_intel do
                url "https://github.com/kevinreber/folio/releases/download/v#{version}/folio-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/kevinreber/folio/releases/download/v#{version}/folio-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_AARCH64_LINUX}"
              end
              on_intel do
                url "https://github.com/kevinreber/folio/releases/download/v#{version}/folio-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "folio"
            end

            test do
              assert_match "folio", shell_output("#{bin}/folio --version")
            end
          end
          FORMULA

      - name: Push to homebrew-tap
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/folio.rb
          git diff --cached --quiet || git commit -m "Update folio to ${GITHUB_REF_NAME}"
          git push
